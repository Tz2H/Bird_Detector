[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-detector"
version = "0.1.0"
description = "Bird detection app migrated to a uv workspace"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.0",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "ultralytics>=8.0.0",
    "nuitka>=2.3.0",
    "pillow>=8.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
]

[project.gui-scripts]
bird-detector = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["bird_detector_app*", "ui*", "utils*"]
